<!DOCTYPE html>
<!-- index.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__ — descargar</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --card: #fff; --line: #e3e1db; --acc: #2f6df6; --acc-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe7; --muted: #9a9993; --card: #1e1e1c; --line: #2f2e2b; --acc: #6b9bff; --acc-fg: #0b0b0b; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 720px; margin: 0 auto; padding: 56px 20px 40px; }
  header { display: flex; gap: 18px; align-items: center; }
  header img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 0; font-size: 2.1rem; letter-spacing: -0.02em; }
  .desc { margin: 4px 0 0; color: var(--muted); font-size: 1.1rem; }
  .ver { color: var(--muted); font-size: .9rem; margin-top: 28px; }
  .main-btn { display: inline-block; margin-top: 10px; padding: 14px 22px; border-radius: 12px; background: var(--acc); color: var(--acc-fg); font-weight: 600; text-decoration: none; font-size: 1.05rem; }
  .main-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .hint { color: var(--muted); font-size: .95rem; margin: 10px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 36px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 1rem; }
  .card p { margin: 0 0 10px; font-size: .9rem; color: var(--muted); }
  .card a { color: var(--acc); font-weight: 600; text-decoration: none; }
  .card.off { opacity: .55; }
  code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; word-break: break-all; }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <img id="icon" src="favicon.png" alt="" hidden>
    <div>
      <h1>__NAME__</h1>
      <p class="desc">__DESCRIPTION__</p>
    </div>
  </header>

  <p class="ver">Versión __VERSION__ · __OS_LIST__</p>
  <a id="main" class="main-btn" href="#">Descargar</a>
  <p id="hint" class="hint"></p>

  <div class="grid" id="grid"></div>

  <footer>
    Se instala solo para tu usuario, sin permisos de administrador y sin tener que instalar Python antes.
    Volver a ejecutar el instalador actualiza el programa.
    <span id="repo"></span>
  </footer>
</main>
<script>
(function () {
  var app = __APP_JSON__;
  if ('__HAS_ICON__') document.getElementById('icon').hidden = false;
  var ua = navigator.userAgent, plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  var mine = /Win/i.test(plat + ua) ? 'windows' : /Mac/i.test(plat) && !/iPhone|iPad/.test(ua) ? 'macos' : /Linux|X11/i.test(plat + ua) && !/Android/i.test(ua) ? 'linux' : '';
  var label = { windows: 'Windows', linux: 'Linux', macos: 'macOS' };
  var how = {
    windows: 'Abre el archivo descargado. Si Windows avisa («Windows protegió tu PC»), pulsa «Más información» y «Ejecutar de todos modos».',
    linux: 'En una terminal: <code>bash ~/Descargas/' + (app.installers.linux || '').split('/').pop() + '</code> — o directamente: <code>curl -fsSL ' + (app.installers.linux || '') + ' | bash</code>',
    macos: 'Descomprime el zip y abre «Instalar ' + app.name + '.command» con clic derecho > Abrir (la primera vez macOS lo pide así).'
  };
  var grid = document.getElementById('grid');
  ['windows', 'linux', 'macos'].forEach(function (os) {
    var url = app.installers[os], c = document.createElement('div');
    c.className = 'card' + (url ? '' : ' off');
    c.innerHTML = '<h3>' + label[os] + '</h3>' + (url
      ? '<p>' + how[os] + '</p><a href="' + url + '" download>Descargar</a>'
      : '<p>Aún no disponible para ' + label[os] + '.</p>');
    grid.appendChild(c);
  });
  var btn = document.getElementById('main'), hint = document.getElementById('hint');
  if (mine && app.installers[mine]) {
    btn.href = app.installers[mine]; btn.setAttribute('download', '');
    btn.textContent = 'Descargar para ' + label[mine];
    hint.innerHTML = how[mine];
  } else if (mine) {
    btn.textContent = 'Aún no disponible para ' + label[mine];
    btn.setAttribute('aria-disabled', 'true');
    hint.textContent = 'De momento hay instalador para: ' + app.os.map(function (o) { return label[o]; }).join(', ') + '.';
  } else {
    btn.textContent = 'Elige tu sistema abajo';
    btn.href = '#grid';
  }
  if (app.repo) document.getElementById('repo').innerHTML = '· <a href="' + app.repo + '">Código fuente</a>';
})();
</script>
</body>
</html>
