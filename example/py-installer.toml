# py-installer.toml
# Programa de ejemplo: lo usan las pruebas automaticas de py-installer en Windows, Linux y macOS.

[app]
id = "hola-pyi"
name = "Hola py-installer"
entry = "hola.py"
description = "Programa de ejemplo de py-installer"
desktop_shortcut = false

[icon]
png = "assets/icon.png"

[deps]
required = ["pillow"]
optional = [{ pkg = "paquete-que-no-existe-pyi", why = "prueba de opcional que falla" }]

[check]
code = "import PIL, tkinter; tkinter.Tcl()"

[data]
zip = "datos"
keep = ["notas.txt"]

# tipo de archivo propio: en Windows y Linux se abre con el programa con doble clic
[[associate]]
ext = [".hola"]
description = "Saludo de ejemplo"

# idiomas: un instalador de Windows por idioma; el programa saca sus textos de lang/*.json.
# Los textos del manifiesto (descripcion, tipos de archivo...) se traducen aqui: "original" = "traduccion".
[i18n.en]
"Programa de ejemplo de py-installer" = "py-installer sample program"
"Saludo de ejemplo" = "Sample greeting"
"prueba de opcional que falla" = "test of an optional package that fails"

[i18n.ca]
"Programa de ejemplo de py-installer" = "Programa d'exemple de py-installer"
"Saludo de ejemplo" = "Salutació d'exemple"
"prueba de opcional que falla" = "prova d'un paquet opcional que falla"
