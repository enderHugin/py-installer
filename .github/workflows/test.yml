# test.yml
# Prueba de verdad los instaladores: monta el programa de ejemplo, lo sirve en local y lo instala,
# comprueba que arranca, reinstala (actualizacion) y desinstala; en Windows, Linux y macOS.
name: Probar instaladores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOLA_PYI_NO_LAUNCH: '1'
      PYI_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pillow
      - name: Montar el sitio del ejemplo
        shell: bash
        run: |
          python pyi.py check --app example
          python pyi.py build --app example --base http://127.0.0.1:8765 --out _site --repo https://github.com/${{ github.repository }}
      - name: Servir el sitio en local
        shell: bash
        run: |
          # --bind: en macOS, sin el, escucha solo por IPv6 y 127.0.0.1 no contesta
          (cd _site && nohup python -m http.server 8765 --bind 127.0.0.1 > ../http.log 2>&1 &)
          for i in $(seq 1 20); do curl -fsS --max-time 2 http://127.0.0.1:8765/dl/app.json && exit 0; sleep 1; done
          exit 1

      # ---- Linux / macOS ----------------------------------------------------------------------
      - name: Sintaxis (bash)
        if: runner.os != 'Windows'
        run: bash -n _site/dl/hola-pyi-instalar.sh
      - name: Instalar (Linux)
        if: runner.os == 'Linux'
        run: bash _site/dl/hola-pyi-instalar.sh
      - name: Instalar (macOS, desde el zip como lo haria un usuario)
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/mac && cd /tmp/mac && unzip -o "$GITHUB_WORKSPACE/_site/dl/hola-pyi-instalar-macos.zip"
          test -x "Instalar Hola py-installer.command"
          bash "Instalar Hola py-installer.command"
      - name: Comprobar, reinstalar y desinstalar (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then ROOT="$HOME/Library/Application Support/hola-pyi"; test -d "$HOME/Applications/Hola py-installer.app"
          else ROOT="$HOME/.local/share/hola-pyi"; test -f "$HOME/.local/share/applications/hola-pyi.desktop"; fi
          "$ROOT/app/.venv/bin/python" "$ROOT/app/hola.py" --check
          if [ "$RUNNER_OS" = macOS ]; then grep -q "<string>hola</string>" "$HOME/Applications/Hola py-installer.app/Contents/Info.plist"
          else grep -q "^MimeType=application/x-hola-pyi-hola;" "$HOME/.local/share/applications/hola-pyi.desktop"
               grep -q '%f' "$HOME/.local/share/applications/hola-pyi.desktop"
               test -f "$HOME/.local/share/mime/packages/hola-pyi.xml"; fi
          "$ROOT/app/.venv/bin/python" "$ROOT/app/pyi_update.py" "$ROOT/app/hola.py" check | grep -q '"state": "same"'
          test -f "$ROOT/app/notas.txt"
          echo "editado" > "$ROOT/app/notas.txt"
          bash "$GITHUB_WORKSPACE/_site/dl/hola-pyi-instalar.sh"          # segunda vez = actualizar
          grep -q editado "$ROOT/app/notas.txt"
          bash "$ROOT/uninstall.sh" --si
          test -f "$ROOT/app/notas.txt"
          test ! -e "$ROOT/app/.venv"
          if [ "$RUNNER_OS" = Linux ]; then test ! -e "$HOME/.local/share/mime/packages/hola-pyi.xml"; fi
          echo OK

      # ---- Windows ----------------------------------------------------------------------------
      - name: Sintaxis (PowerShell incrustado, el instalador de cada idioma)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem _site\dl\hola-pyi-instalar*.cmd) {
            $t = [IO.File]::ReadAllText($f.FullName)
            $ps = $t.Substring($t.IndexOf('##PS##'))
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($ps, [ref]$null, [ref]$errs)
            if ($errs) { Write-Host $f.Name; $errs | ForEach-Object { Write-Host $_ }; exit 1 }
            Write-Host ('ok ' + $f.Name)
          }
      - name: Instalar en ingles (Windows), como lo bajaria un visitante con el navegador en ingles
        if: runner.os == 'Windows'
        shell: cmd
        run: call _site\dl\hola-pyi-instalar-en.cmd
      - name: Idioma (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prog = Join-Path $env:LOCALAPPDATA 'Programs\hola-pyi'
          $root = Join-Path $env:LOCALAPPDATA 'hola-pyi'
          if ((Get-Content "$prog\lang.json" -Raw | ConvertFrom-Json).lang -ne 'en') { throw 'lang.json no dice en' }
          if ((Get-Content "$prog\install_info.json" -Raw | ConvertFrom-Json).lang -ne 'en') { throw 'install_info.json no dice en' }
          $log = Get-Content "$root\logs\instalacion.log" -Raw -Encoding UTF8
          if ($log -notmatch 'Downloading Hola py-installer' -or $log -notmatch 'Done\. Hola py-installer is installed') { throw 'el instalador no hablo en ingles' }
          foreach ($f in 'langkit.py', 'lang\en.json', 'lang\pyi.ca.json', 'lang\common.es.json') { if (-not (Test-Path "$prog\$f")) { throw ('falta ' + $f) } }
          $env:PYTHONIOENCODING = 'utf-8'
          $out = & "$prog\.venv\Scripts\python.exe" "$prog\hola.py" --check | Out-String
          if ($out -notmatch ' en Hello! Installed') { throw ('hola.py no saluda en ingles: ' + $out) }
          $un = Get-Content "$root\uninstall.ps1" -Raw -Encoding UTF8
          if ($un -notmatch 'has been uninstalled') { throw 'el desinstalador no esta en ingles' }
          if ((Get-Item 'HKCU:\Software\Classes\hola-pyi.hola').GetValue('') -ne 'Sample greeting') { throw 'el tipo de archivo no esta en ingles' }
          'OK'
      - name: Instalar (Windows), encima: el idioma elegido se conserva
        if: runner.os == 'Windows'
        shell: cmd
        run: call _site\dl\hola-pyi-instalar.cmd
      - name: Comprobar, reinstalar y desinstalar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prog = Join-Path $env:LOCALAPPDATA 'Programs\hola-pyi'
          $root = Join-Path $env:LOCALAPPDATA 'hola-pyi'
          & "$prog\.venv\Scripts\python.exe" "$prog\hola.py" --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $chk = & "$prog\.venv\Scripts\python.exe" "$prog\pyi_update.py" "$prog\hola.py" check | Out-String
          if ($chk -notmatch '"state": "same"') { throw ('el actualizador no ve la instalacion: ' + $chk) }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Hola py-installer.lnk'))) { throw 'falta el acceso directo' }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\hola-pyi')) { throw 'falta la entrada en Aplicaciones instaladas' }
          $cmdline = (Get-Item 'HKCU:\Software\Classes\hola-pyi.hola\shell\open\command').GetValue('')
          if ($cmdline -notmatch 'hola\.py" "%1"') { throw ('asociacion: orden mal: ' + $cmdline) }
          if ((Get-Item 'HKCU:\Software\Classes\.hola').GetValue('') -ne 'hola-pyi.hola') { throw 'asociacion: .hola no queda con el programa' }
          if ($null -eq (Get-Item 'HKCU:\Software\Classes\.hola\OpenWithProgids').GetValue('hola-pyi.hola', $null)) { throw 'asociacion: falta en Abrir con' }
          if ((Get-Content "$prog\lang.json" -Raw | ConvertFrom-Json).lang -ne 'en') { throw 'reinstalar cambio el idioma elegido' }
          Set-Content "$prog\notas.txt" 'editado'
          cmd /c "_site\dl\hola-pyi-instalar.cmd"
          if ($LASTEXITCODE -ne 0) { throw 'la reinstalacion fallo' }
          if ((Get-Content "$prog\notas.txt") -ne 'editado') { throw 'la reinstalacion piso los datos' }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root\uninstall.ps1" -Si
          if (-not (Test-Path "$prog\notas.txt")) { throw 'la desinstalacion borro los datos que debia conservar' }
          if (-not (Test-Path "$prog\lang.json")) { throw 'la desinstalacion borro el idioma elegido' }
          if (Test-Path "$prog\.venv") { throw 'la desinstalacion no quito el programa' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\hola-pyi') { throw 'quedo la entrada del registro' }
          if (Test-Path 'HKCU:\Software\Classes\hola-pyi.hola') { throw 'quedo la asociacion' }
          if ((Get-Item 'HKCU:\Software\Classes\.hola').GetValue('')) { throw 'quedo .hola apuntando al programa' }
          'OK'
      - name: Registro de la instalacion (si algo falla)
        if: failure()
        shell: bash
        run: |
          cat http.log || true
          for f in "$HOME/.local/share/hola-pyi/logs/instalacion.log" "$HOME/Library/Application Support/hola-pyi/logs/instalacion.log" "$LOCALAPPDATA/hola-pyi/logs/instalacion.log"; do
            [ -f "$f" ] && { echo "== $f"; tail -n 80 "$f"; }
          done; true

  actualizador:
    # el actualizador comun: comprobar, aplicar (con archivo nuevo), volver atras, formato antiguo,
    # seguridad; y sus ventanas (tkinter y Qt) con el atajo secreto, en una pantalla virtual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_update.py
      - name: Idiomas (diccionarios, instalador por idioma, pagina)
        run: python tests/test_i18n.py
      - name: Ventanas de tkinter y Qt, atajo secreto, vigilar sola (Xvfb)
        run: |
          sudo apt-get install -y -qq xvfb libegl1 libxkbcommon0 > /dev/null
          python -m pip install -q PySide6-Essentials || true
          QT_QPA_PLATFORM=offscreen xvfb-run -a python tests/test_ui.py

  solo-un-sistema:
    # un programa que solo tiene instalador para Windows (como cam-ui hoy): no debe generar los demas,
    # y el instalador de Linux/macOS de un programa sin Linux debe negarse con un mensaje claro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp -r example /tmp/solo && cd /tmp/solo
          sed -i 's/^desktop_shortcut = false/desktop_shortcut = false\nos = ["windows"]/' py-installer.toml
          python3 "$GITHUB_WORKSPACE/pyi.py" build --app . --base https://x.example --out /tmp/s1
          test -f /tmp/s1/dl/hola-pyi-instalar.cmd
          test ! -e /tmp/s1/dl/hola-pyi-instalar.sh
          test ! -e /tmp/s1/dl/hola-pyi-instalar-macos.zip
          grep -q '"os": \[' /tmp/s1/dl/app.json
          sed -i 's/^os = .*/os = ["macos"]/' py-installer.toml
          python3 "$GITHUB_WORKSPACE/pyi.py" build --app . --base https://x.example --out /tmp/s2
          unzip -p /tmp/s2/dl/hola-pyi-instalar-macos.zip > /tmp/mac.sh
          if bash /tmp/mac.sh > /tmp/out.txt 2>&1; then echo "deberia haber fallado"; exit 1; fi
          grep -q "aun no esta disponible para Linux" /tmp/out.txt
          echo OK
