<!DOCTYPE html>
<!-- index.html -->
<html lang="__SOURCE_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --card: #fff; --line: #e3e1db; --acc: #2f6df6; --acc-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe7; --muted: #9a9993; --card: #1e1e1c; --line: #2f2e2b; --acc: #6b9bff; --acc-fg: #0b0b0b; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 720px; margin: 0 auto; padding: 56px 20px 40px; }
  header { display: flex; gap: 18px; align-items: center; }
  header img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 0; font-size: 2.1rem; letter-spacing: -0.02em; }
  .desc { margin: 4px 0 0; color: var(--muted); font-size: 1.1rem; }
  .ver { color: var(--muted); font-size: .9rem; margin-top: 28px; }
  .main-btn { display: inline-block; margin-top: 10px; padding: 14px 22px; border-radius: 12px; background: var(--acc); color: var(--acc-fg); font-weight: 600; text-decoration: none; font-size: 1.05rem; }
  .main-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .hint { color: var(--muted); font-size: .95rem; margin: 10px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 36px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 1rem; }
  .card p { margin: 0 0 10px; font-size: .9rem; color: var(--muted); }
  .card a { color: var(--acc); font-weight: 600; text-decoration: none; }
  .card.off { opacity: .55; }
  code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; word-break: break-all; }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
  footer a { color: inherit; }
  .lang { float: right; margin-top: -30px; color: var(--muted); font-size: .85rem; }
  .lang select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
</style>
</head>
<body>
<main>
  <label class="lang" id="langbox" hidden><span data-t="page.lang">Idioma del instalador</span><select id="lang"></select></label>
  <header>
    <img id="icon" src="favicon.png" alt="" hidden>
    <div>
      <h1>__NAME__</h1>
      <p class="desc">__DESCRIPTION__</p>
    </div>
  </header>

  <p class="ver" id="ver">__VERSION__ · __OS_LIST__</p>
  <a id="main" class="main-btn" href="#">↓</a>
  <p id="hint" class="hint"></p>

  <div class="grid" id="grid"></div>

  <footer>
    <span data-t="page.footer"></span>
    <span id="repo"></span>
  </footer>
</main>
<script>
(function () {
  var app = __APP_JSON__;
  // textos de la pagina en cada idioma (lang/pyi.<idioma>.json de py-installer) y el idioma del visitante:
  // ?lang=xx, el que eligio antes aqui, el de su navegador o el original (mismas reglas que lang-kit)
  var D = __PAGE_DICTS__, SRC = '__SOURCE_LANG__', STORE = 'langkit.lang';
  var langs = Object.keys(D);
  function match(w) {
    w = String(w || '').replace(/_/g, '-').toLowerCase(); if (!w) return null;
    for (var i = 0; i < langs.length; i++) if (langs[i].toLowerCase() === w) return langs[i];
    for (i = 0; i < langs.length; i++) if (langs[i].split('-')[0].toLowerCase() === w.split('-')[0]) return langs[i];
    return null;
  }
  function pick() {
    var c = [], q = /[?&]lang=([^&#]+)/.exec(location.search);
    if (q) c.push(decodeURIComponent(q[1]));
    try { var s = localStorage.getItem(STORE); if (s) c.push(s); } catch (e) { }
    c = c.concat(navigator.languages || [navigator.language || '']);
    for (var i = 0; i < c.length; i++) { var g = match(c[i]); if (g) return g; }
    return match('en') || SRC;       // un idioma que no hay: mejor ingles que el original
  }
  var lang = pick();
  function t(k, v) {
    var s = (D[lang] && D[lang][k]) || (D.en && D.en[k]) || (D[SRC] && D[SRC][k]) || k;
    return s.replace(/\{([a-z0-9_]+)\}/g, function (m, n) { return v && v[n] !== undefined ? v[n] : m; });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  if ('__HAS_ICON__') document.getElementById('icon').hidden = false;
  var ua = navigator.userAgent, plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  var mine = /Win/i.test(plat + ua) ? 'windows' : /Mac/i.test(plat) && !/iPhone|iPad/.test(ua) ? 'macos' : /Linux|X11/i.test(plat + ua) && !/Android/i.test(ua) ? 'linux' : '';
  var label = { windows: 'Windows', linux: 'Linux', macos: 'macOS' };

  function render() {
    var inst = (app.installers_by_lang && app.installers_by_lang[lang]) || app.installers;
    document.documentElement.lang = lang;
    document.title = t('page.title', { app: app.name });
    var desc = (app.descriptions && app.descriptions[lang]) || app.description;
    document.querySelector('.desc').textContent = desc;
    document.getElementById('ver').textContent = t('page.version', { v: app.version, os: app.os.map(function (o) { return label[o]; }).join(', ') });
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (n) { n.textContent = t(n.getAttribute('data-t')); });
    var lin = inst.linux || '';
    var how = {
      windows: esc(t('page.how.windows')),
      linux: esc(t('page.how.linux', { cmd1: '\u0001', cmd2: '\u0002' }))
        .replace('\u0001', '<code>bash ~/' + esc(t('page.downloads_dir')) + '/' + esc(lin.split('/').pop()) + '</code>')
        .replace('\u0002', '<code>curl -fsSL ' + esc(lin) + ' | bash</code>'),
      macos: esc(t('page.how.macos', { file: 'Instalar ' + app.name + '.command' }))
    };
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    ['windows', 'linux', 'macos'].forEach(function (os) {
      var url = inst[os], c = document.createElement('div');
      c.className = 'card' + (url ? '' : ' off');
      c.innerHTML = '<h3>' + label[os] + '</h3>' + (url
        ? '<p>' + how[os] + '</p><a href="' + esc(url) + '" download>' + esc(t('page.download')) + '</a>'
        : '<p>' + esc(t('page.not_yet', { os: label[os] })) + '.</p>');
      grid.appendChild(c);
    });
    var btn = document.getElementById('main'), hint = document.getElementById('hint');
    btn.removeAttribute('aria-disabled'); btn.removeAttribute('download');
    if (mine && inst[mine]) {
      btn.href = inst[mine]; btn.setAttribute('download', '');
      btn.textContent = t('page.download_for', { os: label[mine] });
      hint.innerHTML = how[mine];
    } else if (mine) {
      btn.textContent = t('page.not_yet', { os: label[mine] });
      btn.setAttribute('aria-disabled', 'true');
      hint.textContent = t('page.only_for', { list: app.os.map(function (o) { return label[o]; }).join(', ') });
    } else {
      btn.textContent = t('page.pick_os');
      btn.href = '#grid';
      hint.textContent = '';
    }
    if (app.repo) document.getElementById('repo').innerHTML = '· <a href="' + esc(app.repo) + '">' + esc(t('page.source')) + '</a>';
  }

  // selector de idioma (solo si hay mas de uno)
  var sel = document.getElementById('lang');
  if (langs.length > 1) {
    langs.forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = (D[c]['@meta'] || {}).name || c; sel.appendChild(o); });
    sel.value = lang;
    sel.onchange = function () { lang = sel.value; try { localStorage.setItem(STORE, lang); } catch (e) { } render(); };
    document.getElementById('langbox').hidden = false;
  }
  render();
})();
</script>
</body>
</html>
