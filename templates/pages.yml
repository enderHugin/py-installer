# pages.yml
# Publica la pagina de descarga y los instaladores en GitHub Pages con py-installer.
# Una vez: en el repo, Settings > Pages > Source: "GitHub Actions".
name: Publicar pagina e instaladores

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: enderHugin/py-installer@v1     # v1 recibe arreglos sin cambios incompatibles
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
